# XcodeGen spec for the Quick Look extension only. The app itself is built by `swift build`
# (Scripts/build.sh); `Scripts/build.sh quicklook` generates MDown.xcodeproj from this
# file, builds the .appex with xcodebuild, and embeds it in build/M↓.app. The extension's
# Info.plist and entitlements are generated into build/ from the properties below.
name: MDown
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  MDownQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - QuickLook
      - Sources/MDown/Markdown
      - Sources/MDown/Typography.swift
      - Sources/MDown/TextFileDecoding.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stonehub.mdown.quicklook
        PRODUCT_NAME: MDownQuickLook
        APPLICATION_EXTENSION_API_ONLY: true
    info:
      path: build/MDownQuickLook-Info.plist
      properties:
        CFBundleName: MDownQuickLook
        CFBundleDisplayName: "M↓ Markdown Preview"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - net.daringfireball.markdown
            QLSupportsSearchableItems: false
    entitlements:
      path: build/MDownQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
